[workspace]
resolver = "2"
members = [
    "crates/keryx-infer",
    "crates/keryx-infer-sys",
    "crates/keryx-infer-protocol",
    "crates/keryx-infer-conformance",
    "crates/keryx-infer-vectors",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/fearke85/keryx-infer"
description = "Canonical Keryx inference engine and compatibility class for H15 verifiable inference"

[workspace.dependencies]
blake3 = "1"
borsh = { version = "1", features = ["derive"] }
hex = "0.4"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
